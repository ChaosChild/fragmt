name: Release

# M5: a tag is the entire release ritual. The gate can't be skipped —
# the same triple CI runs, then build, publish (provenance), GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org" # wires NODE_AUTH_TOKEN into npmrc
      - run: npm ci
      - run: npm run typecheck
      - run: npx biome ci .
      - run: npm test
      - run: npm run build # also guarded by prepublishOnly
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # npm reads NODE_AUTH_TOKEN, not NPM_TOKEN
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

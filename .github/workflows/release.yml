name: Release

# M5: a tag is the entire release ritual. The gate can't be skipped –
# the same triple CI runs, then build, publish (provenance), GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance + trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx biome ci .
      - run: npm test
      - run: npm run build # also guarded by prepublishOnly
      - run: npm install -g npm@^12 # trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.x
      - run: npm publish --provenance
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

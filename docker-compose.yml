# Sample: fragmt serve --auth in Docker - see docs/HOSTING.md.
#
# Create a .env file next to this file:
#   GH_CLIENT_ID=...your oauth app client id...
#   GH_CLIENT_SECRET=...your oauth app client secret...
# Compose reads .env automatically, and .env is gitignored.
#
# Point the ./my-docs volume at your clone (a normal git clone that has run
# `npx fragmt init` once), then: docker compose up -d
services:
  fragmt:
    build: .
    ports:
      - "4400:4400"
    environment:
      GH_CLIENT_ID: ${GH_CLIENT_ID}
      GH_CLIENT_SECRET: ${GH_CLIENT_SECRET}
    volumes:
      - ./my-docs:/docs
